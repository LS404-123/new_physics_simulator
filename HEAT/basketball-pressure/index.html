<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>籃球打氣｜粒子撞壁與壓強</title>
<script defer src="model.js"></script>
<script defer src="particles.js"></script>
<script defer src="app.js"></script>
<style>
:root{--paper:#f6fafb;--ink:#203f50;--muted:#536d7a;--line:#c9dce3;--blue:#247b9d;--warm:#a95530;--pale:#e8f3f7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e7eff3;color:var(--ink)}
body{display:grid;place-items:center;font:14px "Segoe UI","Microsoft JhengHei",sans-serif}
.app{width:1140px;height:768px;display:grid;grid-template-rows:64px 44px minmax(0,1fr) 32px;background:var(--paper);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,p,figure,dl,dd{margin:0}h1{font-size:24px;font-weight:650}h2{font-size:17px;font-weight:650}
button{font:inherit;color:var(--ink);background:white;border:1px solid var(--line);border-radius:8px;min-height:46px;padding:0 14px;cursor:pointer;touch-action:manipulation}button:hover{background:var(--pale)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:3px}::selection{background:#c6e7ee;color:var(--ink)}
.topbar{display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line)}.topbar span{font-size:12px;color:var(--muted)}.topbar a{margin-left:auto;display:grid;place-items:center;min-width:48px;min-height:44px;color:var(--ink);text-underline-offset:4px}
.comparison-note{padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.comparison-note strong{font-weight:600;color:var(--ink)}
.workspace{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) 248px;gap:12px;padding:0 24px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-height:0}
.vessel{min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;background:white;display:grid;grid-template-rows:44px minmax(0,1fr) 68px 30px}.vessel header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px}.fixed{font-size:12px;color:var(--muted)}
.diagram{min-height:0;display:grid;place-items:center;background:#f1f7f9}.diagram svg{display:block;width:100%;height:100%}svg text{font:14px "Segoe UI","Microsoft JhengHei",sans-serif;fill:var(--ink)}svg .small{font-size:12px;fill:var(--muted)}
.readings{display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:8px 16px;gap:14px}.readings dt{font-size:12px;color:var(--muted)}.readings dd{font-size:29px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}.readings small{font-size:14px;font-weight:400}.changing dd{color:var(--warm)}
.physical-meaning{padding:0 16px;font-size:13px;color:var(--muted)}.ball-meaning{color:var(--warm)}
.lower-panel{display:grid;grid-template-columns:minmax(0,1fr) 288px;gap:24px;min-height:0;border-top:1px solid var(--line);padding-block:12px}
.plot{display:grid;grid-template-rows:36px minmax(0,1fr);min-width:0;min-height:0}.plot figcaption{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.plot figcaption span{font-size:12px;color:var(--muted);font-weight:400;line-height:1.5}.plot svg{width:100%;height:100%;min-height:0}
.controls{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:46px 46px 40px minmax(0,1fr);gap:8px;align-items:center;min-width:0}.controls button{padding-inline:8px}.primary{background:var(--warm);border-color:var(--warm);color:white;font-weight:600}.primary:hover{background:#914825}.primary svg{width:19px;height:19px;vertical-align:-4px;margin-right:8px;fill:none;stroke:currentColor;stroke-width:1.8}.counter{grid-column:1/-1;white-space:nowrap;color:var(--muted)}.counter strong{font-size:28px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 6px}
.feedback{grid-column:1/-1;line-height:1.5;font-size:13px}.feedback strong{color:var(--warm)}.feedback span{display:block;font-size:12px;color:var(--muted)}footer{display:flex;align-items:center;padding:0 24px;font-size:12px;color:var(--muted)}
@media(max-width:1139px),(max-height:767px){.app{width:min(1140px,100vw);height:min(768px,100svh)}.workspace{padding-inline:16px}.topbar,.comparison-note,footer{padding-inline:16px}.topbar span{display:none}}
@media(orientation:portrait){.app{width:100vw;height:100svh;grid-template-rows:64px 48px minmax(0,1fr) 42px}.comparison{grid-template-columns:1fr;grid-template-rows:1fr 1fr;gap:12px}.vessel{grid-template-columns:minmax(0,1fr) 180px;grid-template-rows:42px minmax(0,1fr) 30px}.vessel header{grid-column:1/-1}.diagram{grid-column:1;grid-row:2}.readings{grid-column:2;grid-row:2;grid-template-columns:1fr;align-content:center;gap:18px}.physical-meaning{grid-column:1/-1;grid-row:3;padding-top:4px}.lower-panel{grid-template-columns:minmax(0,1fr) 260px;gap:16px}#chart text{font-size:18px}footer{line-height:1.4}}
@media(max-width:600px){h1{font-size:19px}.comparison-note{font-size:11px}.comparison-note span{max-width:135px}.vessel{grid-template-columns:minmax(0,1fr) 115px}.vessel header{padding-inline:10px}h2{font-size:14px}.fixed{font-size:11px}.readings{padding:6px 8px}.readings dd{font-size:22px}.readings small{font-size:11px}.physical-meaning{font-size:11px;padding-inline:10px}.workspace{padding-inline:8px;grid-template-rows:minmax(0,1fr) 280px}.lower-panel{grid-template-columns:minmax(0,1fr) 132px;gap:12px}.plot{grid-template-rows:60px minmax(0,1fr)}.plot figcaption{display:block;font-size:12px}.plot figcaption span{display:block;font-size:10px;margin-top:4px}.controls{grid-template-columns:1fr;grid-template-rows:repeat(4,46px) 32px}.controls button{font-size:12px}.counter strong{font-size:22px}.feedback{display:none}footer{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><h1>打氣後，為甚麼壓強上升？</h1><span>HKDSE 2014 · 氣體</span><a href="../../index.html">目錄</a></header>
<div class="comparison-note"><strong>同一氣體量、同一溫度；平均速率不變。</strong><span>每推一次，加入 120 cm³、100 kPa 的空氣</span></div>
<div class="workspace">
<section class="comparison" aria-label="同一氣體量的兩種狀態">
<section class="vessel" aria-labelledby="equivalentTitle">
<header><h2 id="equivalentTitle">若全部放在大氣壓下</h2><span class="fixed">體積隨氣體量增加</span></header>
<div class="diagram"><svg id="equivalentScene" viewBox="0 0 500 300" role="img" aria-labelledby="equivalentDesc">
<title id="equivalentDesc">大氣壓下的等效空氣，粒子在擴大的空間內運動</title>
<circle cx="35" cy="30" r="4" fill="#247b9d"/><text x="48" y="35">原有空氣</text><circle cx="278" cy="30" r="4" fill="#a95530"/><text x="291" y="35">新加入的空氣</text>
<rect x="30" y="68" width="240" height="160" fill="#e2eff5"/>
<rect id="addedVolumeFill" x="270" y="68" width="0" height="160" fill="#f8e5d8"/>
<rect id="gasBoundary" x="30" y="68" width="240" height="160" fill="none" stroke="#547889" stroke-width="2"/>
<g id="equivalentParticles"></g><g id="equivalentHits" aria-hidden="true"></g>
<path d="M30 239v8h240v-8" fill="none" stroke="#247b9d"/><text x="150" y="273" text-anchor="middle">6000 cm³</text>
<path id="addedBracket" d="M270 239v8h0v-8" fill="none" stroke="#a95530"/><text id="addedLabel" x="320" y="273" text-anchor="middle" style="fill:var(--warm)"></text>
</svg></div>
<dl class="readings"><div class="changing"><dt>總體積</dt><dd><span id="equivalentVolume">6000</span> <small>cm³</small></dd></div><div><dt>大氣壓強</dt><dd>100 <small>kPa</small></dd></div></dl>
<p class="physical-meaning">空間一起增加，粒子疏密不變。</p>
</section>
<section class="vessel" aria-labelledby="ballTitle">
<header><h2 id="ballTitle">實際壓進籃球</h2><span class="fixed">體積保持不變</span></header>
<div class="diagram"><svg id="ballScene" viewBox="0 0 500 300" role="img" aria-labelledby="ballDesc">
<title id="ballDesc">籃球內粒子運動、撞壁及打氣筒</title>
<circle cx="154" cy="148" r="121" fill="#f8e5d8" stroke="#a95530" stroke-width="7"/>
<circle cx="154" cy="148" r="114" fill="#f8fbfc" stroke="#d9b29b"/>
<g id="ballParticles"></g><g id="ballHits" aria-hidden="true"></g>
<path d="M276 148h27" stroke="#547889" stroke-width="9"/><path id="flow" d="M298 148h-19m7-6-7 6 7 6" fill="none" stroke="#a95530" stroke-width="3" opacity="0"/>
<rect x="302" y="120" width="128" height="56" rx="3" fill="white" stroke="#547889" stroke-width="2"/>
<rect id="pumpGas" x="304" y="122" width="122" height="52" fill="#f8e5d8"/>
<g id="piston"><path d="M430 148h46m0-24v48" stroke="#203f50" stroke-width="6"/><rect x="423" y="120" width="8" height="56" rx="1" fill="#547889"/></g>
<text x="367" y="98" text-anchor="middle">氣筒</text><text id="pumpLabel" x="367" y="204" text-anchor="middle" class="small">吸入 120 cm³</text><text id="phaseLabel" x="367" y="227" text-anchor="middle" class="small">準備推進</text>
<text x="154" y="294" text-anchor="middle" class="small">球壁亮起的位置，就是撞擊位置</text>
</svg></div>
<dl class="readings"><div><dt>籃球體積</dt><dd>6000 <small>cm³</small></dd></div><div class="changing"><dt>球內絕對壓強</dt><dd><span id="pressure">100</span> <small>kPa</small></dd></div></dl>
<p class="physical-meaning ball-meaning">粒子愈多，同一壁面受到的撞擊愈頻密。</p>
</section>
</section>
<div class="lower-panel">
<figure class="plot"><figcaption>球內壓強的變化<span>每推完一次記錄<br>停止打氣，粒子仍在撞壁。</span></figcaption>
<svg id="chart" viewBox="0 0 780 190" role="img" aria-labelledby="chartTitle"><title id="chartTitle">打氣次數與籃球壓強圖，目標為156 kPa</title>
<g stroke="#dae5e9"><path d="M45 26H750M45 86H750M45 146H750"/><path d="M221.25 26V146M397.5 26V146M573.75 26V146M750 26V146"/></g><path d="M45 20V146H755" fill="none" stroke="#547889"/>
<g class="small"><text x="1" y="12">kPa</text><text x="12" y="30">180</text><text x="12" y="90">140</text><text x="12" y="150">100</text><text x="45" y="168" text-anchor="middle">0</text><text x="221.25" y="168" text-anchor="middle">10</text><text x="397.5" y="168" text-anchor="middle">20</text><text x="573.75" y="168" text-anchor="middle">30</text><text x="750" y="168" text-anchor="middle">40</text><text x="750" y="188" text-anchor="end">打氣次數</text></g>
<path d="M45 62H750" fill="none" stroke="#a95530" stroke-dasharray="5 5"/><text x="747" y="56" text-anchor="end" style="fill:var(--warm)">目標 156 kPa</text>
<path id="recordLine" d="M45 146" fill="none" stroke="#247b9d" stroke-width="2.5"/><g id="recordPoints" fill="#247b9d"></g>
</svg></figure>
<section class="controls" aria-label="打氣操作">
<button id="push" class="primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12H4m6-6-6 6 6 6M3 4v16"/></svg>推活塞一次</button>
<button id="auto" aria-pressed="false">連續打氣</button><button id="motion" aria-pressed="true">暫停粒子</button><button id="reset">重設</button>
<div class="counter">已打氣<strong id="count">0</strong>次</div><p class="feedback" id="feedback" role="status" aria-live="polite">距離目標 <strong>56 kPa</strong><span>連續打氣會在達標時停止</span></p>
</section>
</div>
</div>
<footer>恆溫、忽略漏氣及喉管體積。左圖是等效體積；每點代表一組氣體粒子，運動及撞壁為慢動作示意。</footer>
</main>
</body>
</html>
