.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}

.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}

.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}

.iso-dots[data-tone="lo"] circle{opacity:.22}

.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}

.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}

.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}

.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}

:root{color-scheme:light;--paper:#f7f6f1;--ink:#292c29;--muted:#747970;--line:#d9ddd3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}body{display:grid;place-items:center;background:#e9eae3;color:var(--ink);font-family:"Segoe UI","Microsoft JhengHei",sans-serif}
.app{width:1140px;height:768px;padding:0 18px;display:grid;grid-template-rows:72px minmax(0,1fr) 40px;background:var(--paper)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--muted);margin:0 0 5px}h1{font-size:23px;font-weight:550;letter-spacing:.1em;margin:0}h1 span{font-size:13px;letter-spacing:.06em;font-weight:400;color:var(--muted);margin-left:18px}
a{color:var(--muted);text-decoration:none;font-size:12px;display:flex;align-items:center;min-height:44px;padding:0 6px}button{font:inherit;font-size:12px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;min-width:70px;min-height:44px;padding:0 14px;cursor:pointer;touch-action:manipulation}button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fffffb}button:hover{background:#e9ece3}button[aria-pressed=true]:hover{background:#42473d}:focus-visible{outline:2px solid #66744c;outline-offset:4px}
.figure{min-height:0;min-width:0;background:#fffffb;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-rows:32px minmax(0,1fr) 58px 64px;box-shadow:0 3px 4px #26301d03}.figure-head{padding:0 18px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}.figure-head>span:first-child{letter-spacing:.12em}.stage{position:relative;min-width:0;min-height:0}.stage>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden}.iso-halo{filter:blur(8px)}
#piston-hit{outline:none;cursor:grab;touch-action:none;fill:transparent;stroke:transparent;stroke-width:1}#piston-hit:active{cursor:grabbing}#piston-hit:focus-visible{outline:none;stroke:#7a895d;stroke-width:1.2;stroke-dasharray:4 3;fill:#7a895d0b}#piston-hit:hover{fill:#7a895d09}
#gas-fill{fill:#cdc9b0;opacity:.84;pointer-events:none}#tube-gas{fill:#9868bb;opacity:.86;pointer-events:none}
[data-part^="pipe.rubber"]{--anatomy-paper:#514957;--anatomy-top:#8c7d96;--anatomy-shade-0:#52485e;--anatomy-shade-1:#61536e;--anatomy-shade-2:#726381;--anatomy-shade-3:#81728d;--anatomy-mid:#4b3a59}
.observations{display:flex;align-items:center;justify-content:center;gap:70px;padding:0 18px}.observations>div{display:flex;align-items:center;gap:10px}.observations i{display:block;width:14px;height:28px;border-radius:4px;background:#9868bb;flex:none}.observations strong{display:block;font-size:12px;font-weight:500;line-height:1.6}.observations small{display:block;font-size:11px;color:var(--muted);line-height:1.7}
.figure-bottom{padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #edf0e8}.hint{font-size:13px;margin:0}.hint small{display:block;font-size:11px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:8px}.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
footer{display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:10px;color:var(--muted)}.dial-face text{fill:#303d29;font-family:"Segoe UI","Microsoft JhengHei",sans-serif}.dial-needle{stroke:#2a3027;stroke-width:1.3;stroke-linecap:round;fill:#2a3027}.scale-face text{fill:#3d4936;font-family:"Segoe UI",sans-serif;font-weight:500}
@media(max-width:1139px),(max-height:767px){.app{width:min(1140px,100%);height:100svh;padding:0 16px;grid-template-rows:64px minmax(0,1fr) 40px}}
@media(orientation:portrait){.app{width:100%;height:100svh;grid-template-rows:76px minmax(0,1fr) 58px}.figure{grid-template-rows:36px minmax(0,1fr) 92px 74px}h1 span{display:none}.figure-head{font-size:10px}.hint{font-size:12px}.observations{gap:16px;flex-wrap:wrap;justify-content:flex-start;padding:10px 18px}.observations>div{min-width:42%}footer{display:block;padding-top:8px;line-height:1.6}footer span{display:block}}
@media(max-width:600px){.app{padding:0 10px;grid-template-rows:70px minmax(0,1fr) 64px}h1{font-size:21px}.figure{grid-template-rows:34px minmax(0,1fr) 110px 114px}.observations{padding:6px 13px;gap:8px}.observations>div{width:100%}.observations strong{font-size:11px}.observations small{font-size:10px}.figure-head{font-size:9px;padding:0 12px}.figure-bottom{padding:10px 13px;flex-wrap:wrap}.hint{width:100%}.hint small{font-size:10px}.actions{margin-left:auto}button{min-width:64px;padding:0 12px}footer{font-size:9px}}
