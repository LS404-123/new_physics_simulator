<!doctype html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>分子撞壁與氣體壓強</title>
  <link rel="stylesheet" href="../thermometer-calibration-slope/katex/katex.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="../thermometer-calibration-slope/katex/katex.min.js"></script>
  <script defer src="../gas-laws/model.js"></script>
  <script defer src="../kinetic-gas/model.js"></script>
  <script defer src="model.js"></script>
  <script defer src="chamber-art.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="lab">
    <header>
      <div><nav aria-label="所在位置"><a href="../../index.html">‹　模擬器目錄</a><span>/</span>熱和氣體</nav>
        <h1>分子撞壁與氣體壓強</h1></div>
      <div class="actions"><button id="play"><span class="play-icon" aria-hidden="true"></span><span id="play-label">暫停</span></button>
        <button id="reset"><span class="reset-icon" aria-hidden="true">↺</span>重設</button></div>
    </header>
    <section class="bench" aria-label="三維氣箱及粒子設定">
      <section class="scene" aria-labelledby="scene-title">
        <div class="scene-heading"><h2 id="scene-title">分子觀察室</h2><span class="state"><i></i><span id="run-status">慢鏡播放</span></span></div>
        <svg id="chamber" viewBox="58 34 404 410" role="img" aria-label="立方氣箱內的橙色氦原子向各方向運動。青綠色光圈在六面容器壁的實際撞點向外擴散。"></svg>
        <div class="scene-foot"><span><i class="atom-key"></i>氦原子</span><span><i class="impact-key"></i>撞壁</span><span class="hit-count">六面合計 · 最近 1 皮秒 <b id="hit-count">0</b> 次</span></div>
      </section>
      <aside>
        <section class="settings" aria-labelledby="control-title">
          <h2 id="control-title">粒子設定</h2>
          <label for="speed">整體分子速率 <output id="speed-out" for="speed"></output></label>
          <input type="range" id="speed" min="0.5" max="2" step="0.05" value="1">
          <div class="ends"><span>0.50 ×</span><span>2.00 ×</span></div>
          <label for="count">分子數目 <i>N</i><output id="count-out" for="count"></output></label>
          <input type="range" id="count" min="12" max="96" step="12" value="24">
          <div class="ends"><span>12 粒</span><span>96 粒</span></div>
        </section>
        <section class="relation" aria-labelledby="formula-title">
          <h2 id="formula-title">氣體分子運動論</h2>
          <div class="equation" aria-label="壓強乘體積等於三分之一乘分子數目、分子質量及速率平方的平均值">
            <div><div id="macro"></div><small>宏觀氣體量</small></div>
            <span class="equals">=</span>
            <div><div id="micro"></div><small>分子的性質與運動</small></div>
          </div>
          <div class="legend"><span>與上一步比較</span><b class="up-key">↑ 增加</b><b class="down-key">↓ 減少</b></div>
        </section>
        <section class="readings" aria-labelledby="read-title"><h2 id="read-title">氣體讀數</h2>
          <dl>
            <div><dt>平均壓強</dt><dd><b id="pressure"></b> <span>kPa</span></dd></div>
            <div><dt>速率平方的平均值</dt><dd><b id="mean-square"></b> <span>× 10<sup>6</sup> m²/s²</span></dd></div>
          </dl>
          <div class="constants"><span>固定條件</span><div>每粒質量 <i>m</i>　6.64 × 10<sup>−27</sup> kg</div><div>氣箱體積 <i>V</i>　1.00 × 10<sup>−24</sup> m³</div></div>
        </section>
        <p id="feedback" aria-live="polite" aria-atomic="true">速率不變，增加粒子會怎樣影響撞壁？</p>
      </aside>
    </section>
  </main>
</body>
</html>
