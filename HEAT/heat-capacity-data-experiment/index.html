<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>用數據發現 Q = CΔT</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16324a;
      --muted: #577086;
      --paper: #f7fbfd;
      --panel: rgba(255,255,255,.92);
      --grid: #d9e8ef;
      --navy: #174a6e;
      --red: #d33f49;
      --blue: #176bb5;
      --yellow: #f2c94c;
      --cyan: #35bfd0;
      --line: #9cb6c6;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #eaf3f7;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    button, input { font: inherit; }
    button { min-height: 44px; }
    button:focus-visible, input:focus-visible { outline: 3px solid #ff9f1c; outline-offset: 2px; }
    .app {
      width: min(1100px, 100%);
      height: min(700px, 100svh);
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
      gap: 10px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px double var(--navy);
    }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", "Microsoft JhengHei", serif; font-size: clamp(1.25rem, 2.5vw, 2rem); letter-spacing: .02em; }
    h1 span { color: var(--red); white-space: nowrap; }
    .reset, .primary, .fit {
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .reset { color: var(--navy); background: #fff; border: 2px solid var(--navy); white-space: nowrap; }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(330px, 39%) minmax(0, 61%); gap: 10px; }
    .sidebar { min-height: 0; display: grid; grid-template-rows: 238px minmax(0, 1fr); gap: 10px; }
    .card {
      min-width: 0;
      min-height: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(34, 74, 99, .1);
    }
    .apparatus { position: relative; padding: 8px 10px 6px; overflow: hidden; }
    .card-title { margin: 0; font-size: .82rem; letter-spacing: .08em; color: var(--muted); font-weight: 900; }
    .apparatus svg { width: 100%; height: calc(100% - 20px); display: block; }
    .fixed-note { position: absolute; top: 9px; right: 10px; font-size: .75rem; color: var(--muted); }
    .lab-panel { padding: 10px; display: grid; grid-template-rows: auto auto minmax(0,1fr); gap: 8px; overflow: hidden; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badges { display: flex; gap: 6px; }
    .badge { padding: 4px 9px; border-radius: 999px; border: 2px solid var(--line); background: #fff; font-weight: 900; font-size: .82rem; }
    .badge.active { border-color: var(--navy); background: #e5f3fa; }
    .readout { text-align: right; line-height: 1.05; }
    .readout strong { display: block; font: 900 1.22rem/1 ui-monospace, Consolas, monospace; }
    .readout small { color: var(--muted); font-size: .72rem; }
    .controls { display: grid; gap: 7px; }
    .range-line { display: grid; grid-template-columns: auto minmax(90px, 1fr) 48px; align-items: center; gap: 8px; font-size: .82rem; font-weight: 800; }
    input[type="range"] { width: 100%; min-height: 28px; accent-color: var(--navy); }
    output { font: 900 .9rem/1 ui-monospace, Consolas, monospace; text-align: right; }
    .button-row { display: grid; grid-template-columns: 1fr auto; gap: 7px; }
    .primary { color: #fff; background: var(--navy); }
    .fit { color: #fff; background: var(--red); }
    button:disabled { cursor: not-allowed; opacity: .45; }
    .table-wrap { min-height: 0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: .76rem; }
    caption { text-align: left; padding-bottom: 3px; font-weight: 900; }
    th, td { border: 1px solid #b8ccd8; padding: 3px 4px; text-align: right; height: 22px; }
    th { color: var(--navy); background: #eaf4f8; font-size: .7rem; }
    th:first-child, td:first-child { text-align: center; width: 25px; }
    .graph-card { padding: 10px; display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; overflow: hidden; }
    .graph-head { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
    .graph-head p { margin: 3px 0 0; color: var(--muted); font-size: .75rem; }
    .legend { display: flex; flex-wrap: wrap; justify-content: end; gap: 6px 12px; font-size: .72rem; font-weight: 800; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .dot, .square, .line-key { display: inline-block; flex: none; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); border: 2px solid #8a6510; }
    .square { width: 10px; height: 10px; background: var(--cyan); border: 2px solid #126d79; }
    .line-key { width: 18px; border-top: 3px solid; }
    .line-a { color: var(--red); } .line-b { color: var(--blue); }
    .draw-bar { min-width: 0; min-height: 44px; display: grid; grid-template-columns: minmax(130px,1fr) repeat(3,auto); align-items: center; gap: 6px; border-top: 1px solid #c9dce6; margin-top: 5px; }
    .draw-hint { margin: 0; color: var(--muted); font-size: .7rem; line-height: 1.25; }
    .pen { min-height: 44px; padding: 5px 10px; border: 2px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); font-size: .76rem; font-weight: 900; cursor: pointer; }
    .pen-a:not(:disabled) { border-color: var(--red); } .pen-b:not(:disabled) { border-color: var(--blue); }
    .pen[aria-pressed="true"] { color: #fff; background: var(--navy); border-color: var(--navy); }
    #graph { width: 100%; height: 100%; display: block; min-height: 0; }
    #graph.drawing { cursor: crosshair; touch-action: none; }
    .slope-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .slope { border-top: 2px solid; padding: 5px 8px 0; font-size: .77rem; display: flex; justify-content: space-between; gap: 8px; }
    .slope strong { font-family: ui-monospace, Consolas, monospace; }
    .slope.a { border-color: var(--red); } .slope.b { border-color: var(--blue); }
    .grid-line { stroke: #d9e8ef; stroke-width: 1; }
    .axis { stroke: var(--ink); stroke-width: 2; }
    .tick { fill: var(--muted); font-size: 12px; }
    .axis-label { fill: var(--ink); font-size: 15px; font-weight: 800; }
    .student-line { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 7; opacity: .76; }
    .fit-path { fill: none; stroke-width: 3.2; stroke-linecap: round; }
    .fit-path.animate { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw .7s ease-out forwards; }
    #fitB.animate { animation-delay: .65s; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (orientation: portrait) {
      .app { width: 100%; height: 100svh; max-height: none; grid-template-rows: 52px minmax(0,1fr); }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(330px, 47%) minmax(0,53%); }
      .graph-card { order: -1; }
      .sidebar { grid-template-columns: minmax(250px, 42%) minmax(0,58%); grid-template-rows: 1fr; }
      .apparatus { min-height: 0; }
      .lab-panel { min-height: 0; }
      .fixed-note { display: none; }
    }
    @media (max-width: 820px) and (orientation: landscape) {
      .app { padding: 7px 9px; gap: 7px; grid-template-rows: 48px minmax(0,1fr); }
      .workspace { grid-template-columns: 40% 60%; gap: 7px; }
      .sidebar { grid-template-rows: 218px minmax(0,1fr); gap: 7px; }
      .graph-card, .lab-panel { padding: 8px; }
      .draw-bar { grid-template-columns: minmax(95px,1fr) repeat(3,auto); gap: 4px; }
      .pen { padding-inline: 7px; }
      h1 { font-size: 1.22rem; }
    }
    @media (max-width: 700px) {
      .button-row { grid-template-columns: 1fr; }
      .fit { min-height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-delay: 0s !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>用數據發現 <span><i>Q</i> = <i>C</i>Δ<i>T</i></span></h1>
      <button class="reset" id="reset" type="button" aria-label="重做實驗並重新抽取隨機誤差">↻ 重做實驗</button>
    </header>

    <section class="workspace" aria-label="熱容量實驗工作區">
      <aside class="sidebar" aria-label="實驗裝置、控制及數據">
        <section class="card apparatus" aria-labelledby="apparatus-title">
          <h2 class="card-title" id="apparatus-title">浸入式電熱器裝置</h2>
          <span class="fixed-note">30 W · 初溫 22.0 °C</span>
          <svg viewBox="0 0 360 210" role="img" aria-labelledby="device-title device-desc">
            <title id="device-title">浸入式電熱器加熱樣本</title>
            <desc id="device-desc">電線接駁紅色手柄，兩條金屬桿穿過固定環，螺旋發熱圈浸在隔熱容器內的液體中但不接觸底部，旁邊有溫度計。</desc>
            <defs>
              <linearGradient id="heater-metal" x1="0" x2="1">
                <stop offset="0" stop-color="#3d505c"/><stop offset=".38" stop-color="#f1f6f8"/><stop offset=".65" stop-color="#91a3ad"/><stop offset="1" stop-color="#344854"/>
              </linearGradient>
            </defs>
            <path d="M73 73 L79 194 Q79 201 88 201 H270 Q279 201 279 194 L285 73" fill="#dce8ec" stroke="#405969" stroke-width="4"/>
            <path id="liquid" d="M82 102 H276 L272 191 Q272 195 265 195 H93 Q86 195 86 190 Z" fill="#8fd1e5" opacity=".76"/>
            <g id="immersion-heater">
              <path d="M20 24 C53 5 88 14 106 34" fill="none" stroke="#283844" stroke-width="6" stroke-linecap="round"/>
              <rect x="98" y="18" width="76" height="35" rx="9" fill="#d33f49" stroke="#8c2530" stroke-width="3"/>
              <circle cx="148" cy="35.5" r="6" fill="#f4d4a2" stroke="#6d242b" stroke-width="2"/>
              <path d="M145 36 l3 3 5-7" fill="none" stroke="#6d242b" stroke-width="1.8"/>
              <rect x="116" y="49" width="40" height="14" rx="5" fill="#aeb9bf" stroke="#566773" stroke-width="2.5"/>
              <g fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M125 63 V131 M147 63 V131" stroke="#344854" stroke-width="8"/>
                <path d="M125 63 V131 M147 63 V131" stroke="url(#heater-metal)" stroke-width="4"/>
                <path d="M125 129 C106 129 106 141 125 141 S164 153 144 153 S105 165 125 165 S164 177 144 177 S116 187 147 187 V129" stroke="#344854" stroke-width="8"/>
                <path d="M125 129 C106 129 106 141 125 141 S164 153 144 153 S105 165 125 165 S164 177 144 177 S116 187 147 187 V129" stroke="url(#heater-metal)" stroke-width="4"/>
              </g>
            </g>
            <path d="M82 102 Q110 97 138 102 T194 102 T250 102 T276 102" fill="none" stroke="#287f9b" stroke-width="2"/>
            <path d="M69 67 H289 V79 H69 Z" fill="#eef3f4" stroke="#405969" stroke-width="3"/>
            <rect x="219" y="24" width="19" height="139" rx="9" fill="#f4f7f8" stroke="#405969" stroke-width="3"/>
            <circle cx="228.5" cy="163" r="14" fill="#f4f7f8" stroke="#405969" stroke-width="3"/>
            <rect id="mercury" x="225" y="93" width="7" height="70" rx="3" fill="#d33f49"/>
            <circle cx="228.5" cy="163" r="9" fill="#d33f49"/>
            <g stroke="#405969" stroke-width="1.4">
              <path d="M238 132h10 M238 111h7 M238 90h10 M238 69h7 M238 48h10"/>
            </g>
            <rect x="291" y="97" width="60" height="39" rx="7" fill="#16324a"/>
            <text x="321" y="112" text-anchor="middle" fill="#bcecff" font-size="9">溫度 / °C</text>
            <text id="deviceTemp" x="321" y="129" text-anchor="middle" fill="white" font-family="monospace" font-size="16" font-weight="bold">22.0</text>
            <text id="sampleLabel" x="179" y="120" text-anchor="middle" fill="#16324a" font-size="15" font-weight="bold">樣本 A</text>
          </svg>
        </section>

        <section class="card lab-panel" aria-labelledby="data-title">
          <div class="progress-row">
            <div class="badges" aria-label="量度進度"><span class="badge active" id="badgeA">A 0/6</span><span class="badge" id="badgeB">B 0/6</span></div>
            <div class="readout" aria-live="polite"><small>最新溫度</small><strong id="tempReadout">22.0 °C</strong></div>
          </div>
          <div class="controls">
            <label class="range-line" for="error"><span>隨機誤差幅度</span><input id="error" type="range" min="0" max="30" value="15" step="1"><output id="errorValue" for="error">15%</output></label>
            <div class="button-row">
              <button class="primary" id="measure" type="button">量度樣本 A：40 s</button>
              <button class="fit" id="showFit" type="button" disabled>顯示最佳擬合線</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <caption id="data-title">樣本 A 數據</caption>
              <thead><tr><th>#</th><th><i>t</i> / s</th><th><i>Q</i> / kJ</th><th>Δ<i>T</i> / °C</th><th><i>T</i> / °C</th></tr></thead>
              <tbody id="dataBody"></tbody>
            </table>
          </div>
        </section>
      </aside>

      <section class="card graph-card" aria-labelledby="graph-title">
        <div class="graph-head">
          <div><h2 class="card-title" id="graph-title"><i>Q</i> 對 Δ<i>T</i> 圖</h2><p>擬合限制通過原點：<i>C</i> = Σ(Δ<i>T</i> × <i>Q</i>) / Σ(Δ<i>T</i>²)</p></div>
          <div class="legend" aria-label="圖例">
            <span><i class="dot"></i>樣本 A</span><span><i class="line-key line-a"></i>A 擬合</span>
            <span><i class="square"></i>樣本 B</span><span><i class="line-key line-b"></i>B 擬合</span>
          </div>
        </div>
        <div class="draw-bar">
          <p class="draw-hint" id="drawHint" aria-live="polite">完成兩個樣本後，可畫出你的最佳擬合線。</p>
          <button class="pen pen-a" id="penA" type="button" aria-pressed="false" disabled>畫 A 線</button>
          <button class="pen pen-b" id="penB" type="button" aria-pressed="false" disabled>畫 B 線</button>
          <button class="pen" id="clearLines" type="button" disabled>清除</button>
        </div>
        <svg id="graph" viewBox="0 0 640 520" role="application" tabindex="0" aria-labelledby="graph-title" aria-describedby="graph-desc drawHint">
          <desc id="graph-desc">橫軸為溫升，縱軸為輸入能量。散點會隨量度逐一加入。</desc>
          <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#16324a"/></marker></defs>
          <g id="grid"></g><g id="axes"></g><g id="studentLines"></g><g id="fits"></g><g id="points"></g>
        </svg>
        <div class="slope-row" aria-live="polite">
          <div class="slope a"><span>樣本 A 斜率</span><strong id="slopeA">完成後顯示</strong></div>
          <div class="slope b"><span>樣本 B 斜率</span><strong id="slopeB">完成後顯示</strong></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    "use strict";
    const TIMES = [40, 80, 120, 160, 200, 240];
    const POWER = 30;
    const INITIAL_TEMP = 22;
    const CAPACITY = { A: 0.4, B: 0.7 };
    const SVG_NS = "http://www.w3.org/2000/svg";
    const plot = { left: 62, right: 608, top: 26, bottom: 466, xMax: 24, yMax: 8 };
    const state = { active: "A", count: { A: 0, B: 0 }, error: 15, random: {}, fitShown: false, student: { A: null, B: null }, pen: null, draft: null, drawing: false };
    const $ = (id) => document.getElementById(id);
    const el = (name, attrs = {}) => {
      const node = document.createElementNS(SVG_NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    };
    const energy = (time) => POWER * time / 1000;
    const measuredRise = (sample, index) => energy(TIMES[index]) / CAPACITY[sample] * (1 + state.random[sample][index] * state.error / 100);
    const slope = (sample) => {
      let xy = 0, xx = 0;
      TIMES.forEach((time, i) => { const x = measuredRise(sample, i), y = energy(time); xy += x * y; xx += x * x; });
      return xy / xx;
    };
    const sx = (x) => plot.left + x / plot.xMax * (plot.right - plot.left);
    const sy = (y) => plot.bottom - y / plot.yMax * (plot.bottom - plot.top);
    const randomise = () => { state.random = { A: TIMES.map(() => Math.random() * 2 - 1), B: TIMES.map(() => Math.random() * 2 - 1) }; };
    const experimentComplete = () => state.count.A === 6 && state.count.B === 6;
    const readyToReveal = () => experimentComplete() && Boolean(state.student.A && state.student.B);

    function drawAxes() {
      const grid = $("grid"), axes = $("axes");
      grid.replaceChildren(); axes.replaceChildren();
      for (let x = 0; x <= 24; x += 4) {
        grid.append(el("line", { x1: sx(x), y1: plot.top, x2: sx(x), y2: plot.bottom, class: "grid-line" }));
        const label = el("text", { x: sx(x), y: plot.bottom + 22, "text-anchor": "middle", class: "tick" }); label.textContent = x; axes.append(label);
      }
      for (let y = 0; y <= 8; y += 1) {
        grid.append(el("line", { x1: plot.left, y1: sy(y), x2: plot.right, y2: sy(y), class: "grid-line" }));
        const label = el("text", { x: plot.left - 12, y: sy(y) + 4, "text-anchor": "end", class: "tick" }); label.textContent = y; axes.append(label);
      }
      axes.append(
        el("line", { x1: plot.left, y1: plot.bottom, x2: 620, y2: plot.bottom, class: "axis", "marker-end": "url(#arrow)" }),
        el("line", { x1: plot.left, y1: plot.bottom, x2: plot.left, y2: 14, class: "axis", "marker-end": "url(#arrow)" })
      );
      const xLabel = el("text", { x: 620, y: 503, "text-anchor": "end", class: "axis-label" }); xLabel.textContent = "ΔT / °C";
      const yLabel = el("text", { x: 76, y: 17, class: "axis-label" }); yLabel.textContent = "Q / kJ";
      axes.append(xLabel, yLabel);
    }

    function drawGraph(animate = false) {
      const points = $("points"), fits = $("fits"), studentLines = $("studentLines");
      points.replaceChildren(); fits.replaceChildren(); studentLines.replaceChildren();
      ["A", "B"].forEach((sample) => {
        for (let i = 0; i < state.count[sample]; i++) {
          const x = sx(measuredRise(sample, i)), y = sy(energy(TIMES[i]));
          points.append(sample === "A"
            ? el("circle", { cx: x, cy: y, r: 6, fill: "#f2c94c", stroke: "#8a6510", "stroke-width": 2 })
            : el("rect", { x: x - 6, y: y - 6, width: 12, height: 12, rx: 1, fill: "#35bfd0", stroke: "#126d79", "stroke-width": 2 }));
        }
      });
      ["A", "B"].forEach((sample) => {
        const end = state.pen === sample && state.draft ? state.draft : state.student[sample];
        if (end) studentLines.append(el("line", { x1: plot.left, y1: plot.bottom, x2: end.x, y2: end.y, class: "student-line", stroke: sample === "A" ? "#d33f49" : "#176bb5" }));
      });
      if (state.fitShown) {
        ["A", "B"].forEach((sample) => {
          const c = slope(sample), xEnd = Math.min(plot.xMax, plot.yMax / c);
          fits.append(el("path", { id: `fit${sample}`, d: `M${sx(0)} ${sy(0)} L${sx(xEnd)} ${sy(c * xEnd)}`, class: `fit-path${animate ? " animate" : ""}`, stroke: sample === "A" ? "#d33f49" : "#176bb5" }));
        });
      }
      $("graph").setAttribute("aria-label", `Q 對 ΔT 圖，樣本 A 有 ${state.count.A} 個圓點，樣本 B 有 ${state.count.B} 個方點${state.student.A ? "，已畫 A 線" : ""}${state.student.B ? "，已畫 B 線" : ""}${state.fitShown ? "，並顯示兩條由原點開始的最佳擬合線" : ""}`);
    }

    function choosePen(sample) {
      if (!experimentComplete() || state.fitShown) return;
      state.pen = sample;
      state.draft = state.student[sample] ? { ...state.student[sample] } : null;
      update();
      $("graph").focus();
    }

    function finishStudentLine() {
      if (!state.pen || !state.draft) return;
      const sample = state.pen, other = sample === "A" ? "B" : "A";
      state.student[sample] = { ...state.draft };
      state.pen = state.student[other] ? null : other;
      state.draft = state.pen && state.student[state.pen] ? { ...state.student[state.pen] } : null;
      state.drawing = false;
      update();
      if (state.pen) $("graph").focus();
    }

    function pointerPosition(event) {
      const point = $("graph").createSVGPoint();
      point.x = event.clientX; point.y = event.clientY;
      const local = point.matrixTransform($("graph").getScreenCTM().inverse());
      return { x: Math.max(plot.left, Math.min(plot.right, local.x)), y: Math.max(plot.top, Math.min(plot.bottom, local.y)) };
    }

    function updateTable() {
      const sample = state.active;
      $("data-title").textContent = `樣本 ${sample} 數據`;
      $("dataBody").replaceChildren(...TIMES.map((time, i) => {
        const row = document.createElement("tr"), done = i < state.count[sample];
        const rise = done ? measuredRise(sample, i) : null;
        [i + 1, time, energy(time).toFixed(1), done ? rise.toFixed(2) : "—", done ? (INITIAL_TEMP + rise).toFixed(1) : "—"].forEach((value) => {
          const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
        });
        return row;
      }));
    }

    function update() {
      const sample = state.active, count = state.count[sample];
      $("badgeA").textContent = `A ${state.count.A}/6`; $("badgeB").textContent = `B ${state.count.B}/6`;
      $("badgeA").classList.toggle("active", sample === "A"); $("badgeB").classList.toggle("active", sample === "B");
      $("sampleLabel").textContent = `樣本 ${sample}`; $("liquid").setAttribute("fill", sample === "A" ? "#8fd1e5" : "#83d8c7");
      const temp = count ? INITIAL_TEMP + measuredRise(sample, count - 1) : INITIAL_TEMP;
      $("tempReadout").textContent = `${temp.toFixed(1)} °C`; $("deviceTemp").textContent = temp.toFixed(1);
      $("mercury").setAttribute("y", Math.max(43, 163 - (temp - 18) * 3));
      $("mercury").setAttribute("height", Math.min(120, (temp - 18) * 3));
      if (sample === "A" && count === 6) $("measure").textContent = "開始量度樣本 B";
      else if (sample === "B" && count === 6) { $("measure").textContent = "兩個樣本已完成"; $("measure").disabled = true; }
      else $("measure").textContent = `量度樣本 ${sample}：${TIMES[count]} s`;
      const complete = experimentComplete();
      ["A", "B"].forEach((key) => {
        const button = $(`pen${key}`);
        button.disabled = !complete || state.fitShown;
        button.textContent = `${state.student[key] ? "重畫" : "畫"} ${key} 線${state.student[key] ? " ✓" : ""}`;
        button.setAttribute("aria-pressed", String(state.pen === key));
      });
      $("clearLines").disabled = state.fitShown || (!state.student.A && !state.student.B && !state.draft);
      $("graph").classList.toggle("drawing", Boolean(state.pen) && !state.fitShown);
      $("drawHint").textContent = !complete ? "完成兩個樣本後，可畫出你的最佳擬合線。"
        : state.fitShown ? "虛線是你的線；實線是計算所得的最佳擬合線。"
        : state.pen ? `樣本 ${state.pen}：在圖上拖曳；線會固定通過原點。方向鍵可微調，Enter 確認。`
        : state.student.A && state.student.B ? "兩條線已完成，可以顯示計算所得的最佳擬合線。"
        : "先選擇 A 線或 B 線，再在圖上拖曳。";
      $("showFit").disabled = !readyToReveal() || state.fitShown;
      $("showFit").textContent = state.fitShown ? "已顯示擬合線" : "顯示最佳擬合線";
      $("slopeA").textContent = state.fitShown ? `${slope("A").toFixed(3)} kJ °C⁻¹` : "完成後顯示";
      $("slopeB").textContent = state.fitShown ? `${slope("B").toFixed(3)} kJ °C⁻¹` : "完成後顯示";
      updateTable(); drawGraph();
    }

    $("measure").addEventListener("click", () => {
      if (state.active === "A" && state.count.A === 6) state.active = "B";
      else if (state.count[state.active] < 6) state.count[state.active]++;
      update();
    });
    $("error").addEventListener("input", (event) => { state.error = Number(event.target.value); $("errorValue").value = `${state.error}%`; update(); });
    $("penA").addEventListener("click", () => choosePen("A"));
    $("penB").addEventListener("click", () => choosePen("B"));
    $("clearLines").addEventListener("click", () => { state.student = { A: null, B: null }; state.pen = null; state.draft = null; state.drawing = false; update(); });
    $("graph").addEventListener("pointerdown", (event) => {
      if (!state.pen || state.fitShown) return;
      event.preventDefault(); state.drawing = true; state.draft = pointerPosition(event); $("graph").setPointerCapture(event.pointerId); drawGraph();
    });
    $("graph").addEventListener("pointermove", (event) => {
      if (!state.drawing) return;
      event.preventDefault(); state.draft = pointerPosition(event); drawGraph();
    });
    $("graph").addEventListener("pointerup", (event) => { if (state.drawing) { event.preventDefault(); finishStudentLine(); } });
    $("graph").addEventListener("pointercancel", () => { state.drawing = false; state.draft = state.pen && state.student[state.pen] ? { ...state.student[state.pen] } : null; update(); });
    $("graph").addEventListener("keydown", (event) => {
      if (!state.pen || state.fitShown) return;
      if (event.key === "Escape") { state.pen = null; state.draft = null; state.drawing = false; update(); return; }
      if (event.key === "Enter") { event.preventDefault(); finishStudentLine(); return; }
      const moves = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      if (!moves[event.key]) return;
      event.preventDefault();
      if (!state.draft) state.draft = { x: sx(12), y: sy(4) };
      const step = event.shiftKey ? 12 : 4, [dx, dy] = moves[event.key];
      state.draft = { x: Math.max(plot.left, Math.min(plot.right, state.draft.x + dx * step)), y: Math.max(plot.top, Math.min(plot.bottom, state.draft.y + dy * step)) };
      drawGraph();
    });
    $("showFit").addEventListener("click", () => {
      state.fitShown = true; update(); drawGraph(!matchMedia("(prefers-reduced-motion: reduce)").matches);
    });
    $("reset").addEventListener("click", () => {
      state.active = "A"; state.count = { A: 0, B: 0 }; state.fitShown = false; state.student = { A: null, B: null }; state.pen = null; state.draft = null; state.drawing = false; randomise(); $("measure").disabled = false; update();
    });

    function selfCheck() {
      const savedError = state.error, savedCount = state.count, savedStudent = state.student;
      state.error = 0;
      console.assert(Math.abs(slope("A") - .4) < 1e-12, "樣本 A 零誤差斜率自檢失敗");
      console.assert(Math.abs(slope("B") - .7) < 1e-12, "樣本 B 零誤差斜率自檢失敗");
      console.assert(energy(240) === 7.2, "輸入能量自檢失敗");
      state.count = { A: 6, B: 6 }; state.student = { A: null, B: null };
      console.assert(!readyToReveal(), "未畫學生線時不應解鎖答案");
      state.student = { A: {}, B: {} };
      console.assert(readyToReveal(), "完成兩條學生線後應解鎖答案");
      state.error = savedError; state.count = savedCount; state.student = savedStudent;
      document.documentElement.dataset.selfCheck = "pass";
    }
    randomise(); selfCheck(); drawAxes(); update();
  </script>
</body>
</html>
