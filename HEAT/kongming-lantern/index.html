<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>孔明燈為甚麼升起？</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="model.js"></script>
  <script defer src="lantern-art.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<main class="app">
  <header class="topbar">
    <h1>孔明燈為甚麼升起？</h1>
    <a href="../../index.html">返回目錄</a>
  </header>
  <div class="workspace">
    <figure class="scene">
      <figcaption>孔明燈剖面</figcaption>
      <svg id="scene" viewBox="84 -24 484 430" role="img" aria-labelledby="scene-description" aria-describedby="force-comparison">
        <title id="scene-description">孔明燈底部開口。圓點顯示氣流，箭嘴比較浮力和整盞燈的總重量。</title>
        <desc id="force-comparison"></desc>
        <defs>
          <marker id="warm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a95530" stroke-width="1.7"/></marker>
          <marker id="cool-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#247b9d" stroke-width="1.7"/></marker>
        </defs>
        <path id="launch-line" d="M146 356H424" fill="none" stroke="#9eb6bf" stroke-dasharray="4 4"/>
        <text x="202" y="380" text-anchor="end" class="annotation">起飛前的位置</text>
        <g id="lamp">
          <g id="art-back"></g>
          <g id="air-dots"></g>
          <g id="flow-arrows" fill="none" stroke-width="2.8">
            <path id="up-flow" stroke="#a95530" marker-end="url(#warm-arrow)"/>
            <path id="left-flow" stroke="#247b9d" marker-end="url(#cool-arrow)"/>
            <path id="right-flow" stroke="#247b9d" marker-end="url(#cool-arrow)"/>
            <path id="return-flow" stroke="#247b9d"/>
          </g>
          <g id="art-front"></g>
          <g id="flame" fill="#c26a32"><path d="M-12 0Q-23-17-8-33Q-9-15-1-20Q10-26 4-45Q28-18 13 0Z"/><path d="M-4 0Q-8-12 3-22Q1-8 8 0Z" fill="#f2bd61"/></g>
          <g id="outflow" fill="none" stroke="#a95530" stroke-width="3" marker-end="url(#warm-arrow)"><path id="out-left"/><path id="out-right"/></g>
          <path d="M128 322h58l34 15" fill="none" stroke="#758b94"/>
          <text x="128" y="314" class="annotation">底部開口</text>
          <g class="forces">
            <path id="buoyancy-arrow" stroke="#247b9d" stroke-width="4" marker-end="url(#cool-arrow)"/>
            <path id="weight-arrow" stroke="#a95530" stroke-width="4" marker-end="url(#warm-arrow)"/>
            <text x="442" y="172">浮力</text><text x="442" y="194" id="buoyancy-label" class="cool-text"></text>
            <text x="442" y="285">總重量</text><text x="442" y="307" id="weight-label" class="warm-text"></text>
          </g>
        </g>
      </svg>
    </figure>
    <div class="playback">
      <button type="button" id="play">點火</button>
      <div class="timeline">
        <div><label for="progress">播放進度</label><span id="clock"></span></div>
        <input id="progress" type="range" min="0" step="0.1" value="0">
      </div>
      <button type="button" id="reset">重設</button>
    </div>
    <section class="observations" aria-labelledby="moment">
      <div class="narration" aria-live="polite" aria-atomic="true">
        <h2 id="moment">點火前</h2>
        <p id="explanation">燈內外的空氣同溫。加上燈身和燃料後，整盞燈的總重量大於浮力，需要承托。</p>
      </div>
      <dl class="readings">
        <div><dt>燈內平均溫度</dt><dd id="temperature"></dd></div>
        <div><dt>燈內空氣質量</dt><dd id="air-mass"></dd></div>
        <div><dt>燈身連燃料</dt><dd>80 g</dd></div>
        <div class="total"><dt>整盞燈的總質量</dt><dd id="total-mass"></dd></div>
      </dl>
      <p class="conditions">燈罩體積固定為 0.25 m³，外界氣溫為 27°C，空氣密度為 1.16 kg/m³。</p>
    </section>
  </div>
  <footer>圓點示意空氣流動。播放時間及上升距離只作示意。</footer>
</main>
</body>
</html>
