<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>粒子動能與勢能｜速率與物態</title>
  <script defer src="model.js"></script>
  <script defer src="simulator.js"></script>
  <style>
    :root { --ink:#18293c; --muted:#617085; --line:#dce2ed; --ke:#007e98; --pe:#7453bf; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:#edf0f7; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; }
    button,input,a { -webkit-tap-highlight-color:transparent; }
    button { min-height:48px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; border:1px solid var(--line); border-radius:10px; background:white; color:var(--ink); padding:0 18px; }
    :focus-visible { outline:3px solid #bc5924; outline-offset:3px; }
    main { width:1140px; height:768px; margin:auto; padding:24px; display:grid; grid-template-rows:62px 1fr 28px; gap:18px; }
    header { display:flex; align-items:center; justify-content:space-between; }
    h1 { font-size:30px; margin:0 0 5px; letter-spacing:.03em; }
    header p { margin:0; color:var(--muted); font-size:15px; }
    .home { display:flex; align-items:center; min-height:44px; color:var(--muted); font-size:14px; text-decoration:none; }
    .workspace { display:grid; grid-template-columns:720px 1fr; gap:18px; min-height:0; }
    .scene,.energy { background:white; border:1px solid var(--line); border-radius:16px; }
    .scene { display:flex; flex-direction:column; min-height:0; }
    .scene-head { padding:22px 24px 0; display:flex; justify-content:space-between; align-items:center; }
    .scene-head strong { font-size:23px; }
    .status { color:var(--muted); background:#f1f4f8; padding:7px 12px; border-radius:20px; font-size:13px; }
    #scene { width:100%; min-height:0; flex:1; display:block; }
    .scene-description { margin:0; text-align:center; font-size:16px; color:var(--muted); padding:0 18px 20px; }
    .scene-bottom { padding:18px 24px; border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .phases { display:flex; gap:8px; }
    .phases button[aria-pressed=true] { background:var(--pe); border-color:var(--pe); color:white; }
    #play { width:104px; background:var(--ink); border-color:var(--ink); color:white; }
    aside { display:grid; grid-template-rows:310px 1fr; gap:18px; min-height:0; }
    .energy { padding:20px; display:flex; flex-direction:column; }
    .energy h2 { margin:0; font-size:19px; }
    .energy p { font-size:14px; line-height:1.6; color:var(--muted); margin:10px 0 0; }
    .ke { color:var(--ke); } .pe { color:var(--pe); }
    .reading { display:flex; align-items:baseline; gap:8px; margin-top:14px; }
    #ke { font:600 44px/1.15 Consolas,monospace; }
    #pe { font-size:35px; font-weight:700; line-height:1.3; }
    .unit { color:var(--muted); font-size:13px; }
    .track { height:12px; background:#edf1f6; border-radius:8px; margin-top:12px; overflow:hidden; }
    .fill { display:block; height:100%; border-radius:8px; }
    #ke-bar { background:var(--ke); } #pe-bar { background:var(--pe); }
    .speed-control { margin-top:auto; padding-top:18px; }
    label { display:flex; justify-content:space-between; align-items:center; font-size:16px; font-weight:700; }
    #speed-out { font:600 19px Consolas,monospace; }
    input[type=range] { display:block; width:100%; height:48px; margin:0; accent-color:var(--ke); cursor:pointer; }
    .range-ends { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-top:-4px; }
    .state-order { display:flex; align-items:center; justify-content:space-between; gap:5px; color:var(--pe); font-size:15px; margin-top:14px; }
    .state-order span { padding:8px 9px; border-radius:8px; }
    .state-order .active { background:#eee8fa; font-weight:700; }
    footer { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; }
    #reset { min-height:44px; padding:0 10px; border:0; background:transparent; font-size:13px; font-weight:400; }
    @media (min-width:1140px) and (min-height:768px) { body { min-height:100svh; display:grid; place-items:center; } }
    @media (max-width:1139px) {
      main { width:100%; height:100svh; padding:16px; gap:12px; grid-template-rows:62px 1fr 34px; }
      .workspace { grid-template-columns:minmax(0,1fr) 310px; gap:14px; }
      .scene-bottom { padding:14px; gap:10px; } button { padding:0 14px; }
      .energy { padding:19px; }
    }
    @media (max-width:820px) and (orientation:portrait) {
      main { padding:12px; grid-template-rows:62px 1fr 38px; gap:12px; }
      .workspace { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) 320px; gap:12px; }
      aside { grid-template-columns:1fr 1fr; grid-template-rows:1fr; gap:12px; }
      h1 { font-size:26px; } .scene-head { padding:16px 20px 0; }
      .scene-description { padding-bottom:14px; }
      .scene-bottom { padding:12px 20px; }
      .energy { padding:18px; }
      .state-order { margin-top:12px; }
      footer { font-size:11px; }
    }
  </style>
</head>
<body>
  <main>
    <header><div><h1>粒子動能與勢能</h1><p>速率與動能 · 物態與勢能</p></div><a class="home" href="../../index.html">返回目錄 ↗</a></header>
    <div class="workspace">
      <section class="scene" aria-label="粒子示範">
        <div class="scene-head"><strong id="phase-label">固體</strong><span class="status" id="status">運動中</span></div>
        <svg id="scene" viewBox="0 0 700 420" role="img" aria-label="固定數量的粒子，示意所選物態的排列與運動">
          <rect x="40" y="36" width="620" height="355" rx="17" fill="#f5f8fb" stroke="#dce2ed" stroke-width="2"/>
          <rect id="matter" x="241" y="104.5" width="218" height="218" rx="10" fill="#007e98" opacity="0.055"/>
          <g id="particles" fill="#007e98" stroke="white" stroke-width="2.5"></g>
        </svg>
        <p class="scene-description" id="phase-description"></p>
        <div class="scene-bottom">
          <div class="phases" role="group" aria-label="物態"><button data-phase="solid" aria-pressed="true">固體</button><button data-phase="liquid" aria-pressed="false">液體</button><button data-phase="gas" aria-pressed="false">氣體</button></div>
          <button id="play" type="button">Ⅱ 暫停</button>
        </div>
      </section>
      <aside>
        <section class="energy" aria-label="粒子的平均動能">
          <h2 class="ke">平均動能 KE</h2>
          <div class="reading"><output id="ke" class="ke">1.00</output><span class="unit">相對值</span></div>
          <div class="track"><span class="fill" id="ke-bar"></span></div>
          <p>粒子運動越快，平均動能越大。<br>速率加倍，平均動能變成四倍。</p>
          <div class="speed-control"><label for="speed">粒子速率 <output id="speed-out">1.00</output></label><input id="speed" type="range" min="0" max="2" step="0.05" value="1"><div class="range-ends"><span>0 · 停止</span><span>2 · 快</span></div></div>
        </section>
        <section class="energy" aria-label="內部勢能">
          <h2 class="pe">內部勢能 PE</h2>
          <div class="reading"><output id="pe" class="pe">較低</output><span class="unit">高低示意</span></div>
          <div class="track"><span class="fill" id="pe-bar"></span></div>
          <p>同一物質的粒子排列不同，<br>內部勢能亦不同。</p>
          <div class="state-order" aria-label="勢能由低至高：固體、液體、氣體"><span data-order="solid">固體</span>＜<span data-order="liquid">液體</span>＜<span data-order="gas">氣體</span></div>
        </section>
      </aside>
    </div>
    <footer><span>運動及排列為示意；勢能只比較高低，柱長不代表實際比例。速率及動能使用相對值。</span><button id="reset" type="button">重設</button></footer>
  </main>
</body>
</html>
