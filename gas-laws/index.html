<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>氣體三定律｜裝置與圖像</title>
<link rel="stylesheet" href="../HEAT/thermometer-calibration-slope/katex/katex.min.css">
<script defer src="../HEAT/thermometer-calibration-slope/katex/katex.min.js"></script>
<script defer src="model.js"></script>
<script defer src="app.js"></script>
<style>
:root{--paper:#f6fafb;--ink:#203f50;--muted:#536d7a;--line:#c9dce3;--accent:#247b9d;--warm:#a95530}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e7eff3;color:var(--ink)}
body{display:grid;place-items:center;font-family:"Segoe UI","Microsoft JhengHei",sans-serif}
::selection{background:#c6e7ee;color:var(--ink)}
.app{width:1140px;height:768px;display:grid;grid-template-rows:64px 74px minmax(0,1fr) 28px;background:var(--paper)}
.topbar{display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--line)}
h1{font-size:24px;letter-spacing:.02em;margin:0}h2{font-size:16px;margin:0}
.topbar a{margin-left:auto;display:flex;gap:7px;align-items:center;min-height:44px;color:var(--ink);font-size:13px;text-decoration:none}
.topbar svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7}
button{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;background:white;min-height:44px;padding:0 14px;cursor:pointer;touch-action:manipulation}
@media(hover:hover){button:hover{background:#e5f0f4}}button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:white}
button{transition:transform 120ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}button:active{transform:scale(.97)}
:focus-visible{outline:3px solid var(--warm);outline-offset:3px}
.modes{display:flex;align-items:center;gap:10px;padding:10px 22px}.modes button{display:flex;align-items:center;gap:18px;min-height:50px}
.modes strong{font-size:15px}.modes span{font-size:12px;opacity:.9}
.amount{margin-left:auto;font-size:12px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:408px minmax(0,1fr);gap:18px;padding:0 20px 14px;min-height:0}
.panel{border:1px solid var(--line);border-radius:12px;background:white;min-height:0;min-width:0}
.apparatus{display:grid;grid-template-rows:44px minmax(0,1fr) 80px 142px}
.scene-heading{display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;color:var(--muted)}
.scene-heading h2{font-size:14px;color:var(--ink)}
#scene{width:100%;height:100%;display:block;min-height:0;background:#f1f7f9}
#scene text{font:13px "Microsoft JhengHei",sans-serif;fill:var(--ink)}
#scene .small{font-size:12px;fill:var(--muted)}
.scene-heading{gap:8px}.scene-heading h2{white-space:nowrap}.scene-heading>span{margin-left:auto;white-space:nowrap}
#referenceButton{padding:0 7px;font-size:11px;border:0;background:transparent;text-decoration:underline;text-underline-offset:3px}
dialog{width:min(580px,calc(100vw - 32px));max-height:calc(100svh - 32px);padding:18px;border:0;border-radius:12px;color:var(--ink);box-shadow:0 16px 60px #203f5033}
dialog::backdrop{background:#203f5080}dialog header{display:flex;align-items:center;justify-content:space-between;gap:16px}dialog h2{font-size:18px}dialog img{display:block;width:100%;max-height:55svh;object-fit:contain;margin:10px 0}dialog p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
@media(prefers-reduced-motion:reduce){button{transition:none}button:active{transform:none}}
.readings{display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:10px 16px;gap:10px;border-bottom:1px solid var(--line);margin:0}
.reading dt{font-size:12px;color:var(--muted);margin-bottom:4px}.reading dd{margin:0;font-size:29px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.reading dd small{font-size:12px;font-weight:400;margin-left:7px}.reading.fixed dt,.reading.fixed dd{color:var(--warm)}
.controls{padding:12px 16px;display:grid;grid-template-rows:22px 46px 44px;gap:3px}
.control-label{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600}.control-label output{font-weight:400;color:var(--muted);font-size:12px}
.slider-row{display:grid;grid-template-columns:38px 1fr 42px;align-items:center;gap:9px;font-size:12px;color:var(--muted)}
input[type=range]{width:100%;height:44px;accent-color:var(--accent);cursor:pointer;margin:0}
.actions{display:flex;gap:8px}.actions button{flex:1;font-size:13px}
.chart-panel{display:grid;grid-template-rows:60px minmax(0,1fr) 64px}
.chart-head{display:flex;align-items:center;gap:10px;padding:0 18px}.chart-head h2{font-size:18px;white-space:nowrap}
.graph-options{margin-left:auto;display:flex;gap:4px}.graph-options button{padding:0 11px;font-size:13px;min-width:48px}
.graph-wrap{min-height:0;position:relative}#chart{width:100%;height:100%;display:block}
#chart text{font:12px "Segoe UI","Microsoft JhengHei",sans-serif;fill:var(--muted)}
#chart .axis-title{font-size:14px;fill:var(--ink)}#chart .intercept-label{font-size:12px;fill:var(--warm)}
#curve{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
#extrapolation{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 5;opacity:.7}
#guideX,#guideY{stroke:var(--accent);stroke-dasharray:4 5;stroke-width:1;opacity:.65}
#currentPoint{fill:var(--accent);stroke:white;stroke-width:3}#pointLabel{fill:var(--accent);font-weight:600}
.equation-area{border-top:1px solid var(--line);padding:10px 18px;display:flex;justify-content:space-between;gap:18px;align-items:center}
#formula{font-size:20px}#invariant{font-size:13px;text-align:right;color:var(--accent)}
.footnote{padding:0 22px;font-size:11px;display:flex;align-items:center;color:var(--muted)}
.katex{font-size:1.06em}[hidden]{display:none!important}
@media(max-width:1139px) and (orientation:landscape){
 .app{width:100vw;height:100svh;grid-template-rows:56px 66px minmax(0,1fr) 32px}
 .workspace{grid-template-columns:36% minmax(0,1fr);gap:12px;padding:0 12px 10px}.modes{padding-inline:12px;gap:8px}.modes button{gap:8px;padding-inline:10px}.amount{display:none}
 .apparatus{grid-template-rows:44px minmax(0,1fr) 76px 138px}.chart-head{padding-inline:12px}.graph-options button{padding-inline:8px}.equation-area{padding-inline:12px;gap:4px 8px}#formula{font-size:18px}
}
@media(max-height:767px) and (orientation:landscape){
 .app{width:min(1140px,100vw);height:100svh;grid-template-rows:56px 66px minmax(0,1fr) 32px}
}
@media(orientation:portrait){
 .app{width:100vw;height:100svh;grid-template-rows:60px 68px minmax(0,1fr) 42px}
 .topbar{padding:0 16px}.amount{display:none}.modes{padding:8px 14px;gap:8px}.modes button{flex:1;display:grid;gap:2px;padding:5px 8px}.modes strong{font-size:14px}
 .workspace{grid-template-columns:1fr;grid-template-rows:304px minmax(0,1fr);gap:12px;padding:0 14px 10px}
 .apparatus{grid-template-columns:45% minmax(0,1fr);grid-template-rows:44px 106px minmax(0,1fr)}
 .scene-heading{grid-column:1/-1}#scene{grid-column:1;grid-row:2/4}.readings{grid-column:2;grid-row:2;padding:10px;gap:5px}.reading dd{font-size:23px}.controls{grid-column:2;grid-row:3;padding:10px 14px}
 .chart-panel{grid-template-rows:58px minmax(0,1fr) 64px}.footnote{padding-inline:14px;line-height:1.4}
}
@media(max-width:500px) and (orientation:portrait){
 .app{grid-template-rows:48px 64px minmax(0,1fr) 42px}h1{font-size:20px}.topbar a{font-size:12px}
 .workspace{grid-template-rows:256px minmax(0,1fr);padding-inline:8px;gap:8px}.modes{padding-inline:8px;gap:5px}.modes strong{font-size:12px}.modes span{font-size:11px}
 .apparatus{grid-template-columns:38% minmax(0,1fr);grid-template-rows:44px 80px minmax(0,1fr)}.scene-heading{padding-inline:10px}.scene-heading span{font-size:11px}.reading dt{font-size:11px}.reading dd{font-size:18px}.reading dd small{font-size:11px;margin-left:2px}.controls{padding:8px}.actions button{padding:0 7px;font-size:11px}
 .chart-panel{grid-template-rows:48px minmax(0,1fr) 64px}.chart-head{padding-inline:10px;gap:4px}.chart-head h2{font-size:15px}.graph-options button{padding:0 8px}.equation-area{padding:8px 10px;gap:6px}#formula{font-size:18px}#invariant{font-size:12px}
 #chart text{font-size:20px}#chart .axis-title{font-size:22px}#chart .intercept-label{font-size:20px}
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar"><h1>氣體三定律</h1><a href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>目錄</a></header>
  <nav class="modes" aria-label="選擇氣體定律">
    <button data-mode="boyle" aria-pressed="true"><strong>波以耳定律</strong><span>固定溫度</span></button>
    <button data-mode="charles" aria-pressed="false"><strong>查理定律</strong><span>固定壓強</span></button>
    <button data-mode="pressure" aria-pressed="false"><strong>壓力定律</strong><span>固定體積</span></button>
    <span class="amount">氣體量固定</span>
  </nav>
  <div class="workspace">
    <section class="panel apparatus" aria-labelledby="apparatusTitle">
      <div class="scene-heading"><h2 id="apparatusTitle">針筒與氣壓計</h2><span id="fixedCondition"></span><button id="referenceButton" aria-haspopup="dialog">原照片</button></div>
      <svg id="scene" viewBox="0 0 408 310" role="img" aria-labelledby="sceneTitle sceneDescription">
        <title id="sceneTitle">密閉氣體裝置</title><desc id="sceneDescription"></desc>
        <g id="thermalApparatus" hidden>
        <rect id="bath" x="71" y="48" width="210" height="214" rx="10" fill="#dcecf1" stroke="#abc1cc" stroke-width="2"/>
        <rect x="67" y="261" width="220" height="36" rx="5" fill="#e5edf1" stroke="#abc1cc"/>
        <text x="177" y="285" text-anchor="middle">恆溫套</text>
        <rect x="83" y="39" width="186" height="211" rx="3" fill="white" stroke="#86a7b6" stroke-width="2"/>
        <rect id="gasFill" x="89" width="174" fill="#d9eef5"/>
        <rect id="pistonHead" x="86" width="180" height="12" rx="2" fill="#5e7b8b"/>
        <g id="externalPressure"><path d="M116-38v30m-5-6 5 6 5-6M236-38v30m-5-6 5 6 5-6" fill="none" stroke="#536d7a" stroke-width="2"/><text x="176" y="-21" text-anchor="middle" class="small">100 kPa</text></g>
        <g id="bolts" stroke="#203f50" stroke-width="4" hidden><path d="M98 151v21m156-21v21"/></g>
        <path d="M269 208h53v-27" fill="none" stroke="#86a7b6" stroke-width="3"/>
        <circle cx="322" cy="138" r="43" fill="white" stroke="#86a7b6" stroke-width="2"/>
        <g id="thermalGaugeTicks"></g>
        <text x="322" y="150" text-anchor="middle" style="font-size:10px">kPa</text>
        <path id="gaugeNeedle" d="M322 138v-34" stroke="#247b9d" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="322" cy="138" r="3.5" fill="#247b9d"/>
        <g id="volumeScale" class="small"><path d="M58 76v174m-5-168h10m-10 42h10m-10 42h10m-10 42h10" stroke="#86a7b6" fill="none"/><text x="44" y="86" text-anchor="end">40</text><text x="44" y="128" text-anchor="end">30</text><text x="44" y="170" text-anchor="end">20</text><text x="44" y="212" text-anchor="end">10</text><text x="40" y="265">mL</text></g>
        </g>
        <g id="boyleApparatus">
          <ellipse cx="84" cy="230" rx="49" ry="12" fill="#d49b5f"/><rect x="35" y="217" width="98" height="13" fill="#d49b5f"/><ellipse cx="84" cy="217" rx="49" ry="11" fill="#edc895"/>
          <rect x="77" y="143" width="14" height="68" rx="3" fill="#ae9a6d"/>
          <path d="M86 179 C105 179 112 196 137 196 H146" fill="none" stroke="#bc825f" stroke-width="12" stroke-linecap="round"/>
          <path d="M86 178 C105 178 112 195 137 195 H146" fill="none" stroke="#e3b391" stroke-width="4"/>
          <circle cx="84" cy="94" r="68" fill="#5e6b6e"/><circle cx="84" cy="94" r="63" fill="#fffefa" stroke="#bccacf" stroke-width="3"/>
          <g id="bourdonTicks"></g>
          <text x="84" y="119" text-anchor="middle" style="font-size:11px">kPa</text>
          <path id="bourdonNeedle" d="M84 94v-48" stroke="#a95530" stroke-width="3" stroke-linecap="round"/><circle cx="84" cy="94" r="4" fill="#a95530"/>
          <rect x="138" y="189" width="14" height="14" rx="3" fill="#c9dce3" stroke="#86a7b6"/>
          <rect x="150" y="173" width="128" height="46" rx="4" fill="white" stroke="#86a7b6" stroke-width="2"/>
          <rect id="syringeGas" x="151" y="177" height="38" fill="#d9eef5"/>
          <g id="syringePiston"><rect x="0" y="176" width="7" height="40" rx="2" fill="#566d78"/><rect x="7" y="190" width="106" height="12" rx="2" fill="#cfdee4" stroke="#86a7b6"/><rect x="110" y="171" width="8" height="50" rx="3" fill="#cfdee4" stroke="#86a7b6"/></g>
          <path d="M280 162v68" stroke="#86a7b6" stroke-width="5" stroke-linecap="round"/>
          <g id="syringeTicks"></g><text x="216" y="147" text-anchor="middle" class="small">mL</text>
        </g>
        <g id="particles" fill="#247b9d" aria-hidden="true"></g>
      </svg>
      <dl class="readings" aria-label="即時物理量">
        <div class="reading"><dt id="pLabel">壓強</dt><dd><span id="pValue"></span><small>kPa</small></dd></div>
        <div class="reading"><dt id="vLabel">體積</dt><dd><span id="vValue"></span><small>mL</small></dd></div>
        <div class="reading"><dt id="tLabel">溫度</dt><dd><span id="tValue"></span><small>K</small></dd></div>
      </dl>
      <div class="controls">
        <div class="control-label"><label id="sliderLabel" for="input">調整體積</label><output id="secondaryReading" for="input"></output></div>
        <div class="slider-row"><span id="minValue"></span><input id="input" type="range" min="5" max="20" step="0.1" value="20"><span id="maxValue"></span></div>
        <div class="actions"><button id="reset">重設</button><button id="pause" aria-pressed="false">暫停粒子</button></div>
      </div>
    </section>
    <section class="panel chart-panel" aria-labelledby="chartTitle">
      <div class="chart-head"><h2 id="chartTitle">壓強—體積圖</h2><div id="boyleOptions" class="graph-options" role="group" aria-label="波以耳圖的橫軸"><button id="volumeGraph" aria-pressed="true" aria-label="橫軸：體積 V"><span data-math="V">V</span></button><button id="reciprocalGraph" aria-pressed="false" aria-label="橫軸：體積倒數 1/V"><span data-math="1/V">1/V</span></button></div><div id="temperatureOptions" class="graph-options" role="group" aria-label="圖的溫度單位" hidden><button id="kelvinGraph" aria-pressed="true">K</button><button id="celsiusGraph" aria-pressed="false">°C</button></div></div>
      <div class="graph-wrap">
        <svg id="chart" viewBox="0 0 660 410" role="img" aria-labelledby="chartDescription">
          <defs><mask id="extensionMask" maskUnits="userSpaceOnUse" x="0" y="0" width="660" height="410"><path id="extensionReveal" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/></mask></defs>
          <title id="chartDescription"></title><g id="grid"></g>
          <path id="axes" fill="none" stroke="#536d7a" stroke-width="1.5"/>
          <path id="extrapolation"/><path id="curve"/>
          <line id="guideX"/><line id="guideY"/><circle id="currentPoint" r="6.5"/>
          <text id="pointLabel"></text><text id="xTitle" class="axis-title" x="348" y="398" text-anchor="middle"></text><text id="yTitle" class="axis-title" x="66" y="21"></text>
          <g id="intercept" hidden><circle id="interceptPoint" r="4" fill="#a95530"/><text id="interceptLabel" class="intercept-label"></text></g>
        </svg>
      </div>
      <div class="equation-area"><div id="formula"></div><div id="invariant"></div></div>
    </section>
  </div>
  <footer class="footnote">理想氣體・粒子示意・虛線為外推</footer>
</main>
<dialog id="referenceDialog" aria-labelledby="referenceTitle"><header><h2 id="referenceTitle">實驗照片</h2><button id="closeReference" autofocus>關閉</button></header><img src="boyle-reference.png" alt="使用者提供的照片：針筒經橡膠管連接布爾登氣壓計，推拉活塞可改變密閉氣體的體積。" width="431" height="264"><p>模型採示意刻度、忽略接管體積；各位置為恆溫平衡狀態。</p></dialog>
</body>
</html>
