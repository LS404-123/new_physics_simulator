<html lang="zh-Hant">
<head>

<script defer src="../HEAT/thermometer-calibration-slope/katex/katex.min.js"></script>
<script defer src="model.js"></script><script defer src="apparatus-3d.js"></script><script defer src="app.js"></script>
<style>
:root{--ink:#153844;--muted:#4f6971;--line:#d5e2e4;--teal:#087f7a;--paper:#eef4f5}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#dce7e9;color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC",sans-serif}body{display:grid;place-items:center}button,input,select{font:inherit}button{min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,canvas:focus-visible{outline:3px solid #e7a21e;outline-offset:2px}button:hover:not(:disabled){filter:brightness(.96)}[hidden]{display:none!important}h1,h2,p{margin:0}a{color:inherit}::selection{background:#c4e7df}input{caret-color:var(--teal)}
.app{width:1140px;height:768px;background:var(--paper);padding:18px;display:grid;grid-template-rows:58px minmax(0,1fr) 20px;gap:12px}header{display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:10px}.heading{flex:1}h1{font-size:22px;letter-spacing:.02em}.home{font-size:12px;padding:12px;text-decoration:none;min-height:44px}.workspace{display:grid;grid-template-columns:minmax(0,790px) minmax(0,302px);gap:12px;min-height:0}.panel{min-width:0;min-height:0;background:white;border:1px solid var(--line);border-radius:12px}.scene{display:grid;grid-template-rows:52px minmax(0,1fr) 24px 182px 58px;overflow:hidden}.scene-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 14px;font-size:13px}.scene-actions{display:flex;gap:8px;align-items:center}.badge{font-size:11px;color:var(--teal);background:white;border-radius:4px;padding:5px 8px}#reset-view{font-size:11px;padding:6px 10px}.apparatus-area{position:relative;min-height:0;background:#f4f8f8;overflow:hidden}#apparatus-3d{position:absolute;inset:0}#apparatus-3d canvas{display:block;touch-action:none;cursor:grab}#apparatus-3d canvas:active{cursor:grabbing}.instrument{position:absolute;top:12px;right:14px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:128px;pointer-events:none}.instrument span{display:block;font-size:11px;color:var(--muted)}.instrument strong{font-size:22px;font-variant-numeric:tabular-nums}.instrument small{display:block;font-size:11px;margin-top:4px}.labels{position:absolute;inset:0;pointer-events:none}.apparatus-label{position:absolute;left:0;top:0;white-space:nowrap;font-size:11px;padding:4px 6px;border:1px solid #c3d5d8;border-radius:4px;background:rgba(255,255,255,.95)}.legend{font-size:11px;color:var(--muted);padding:4px 14px}.comparison{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;padding:10px 12px;background:#f2f8f7;border-top:1px solid var(--line)}.energy-area{min-width:0;padding-right:10px;border-right:1px solid #d2e0df}.comparison-title,h2{font-size:13px;font-weight:700}.energy-flow{width:100%;height:130px;display:block}.energy-flow text{font-family:inherit;font-size:13px;fill:var(--ink)}.ambient-note{font-size:10px;line-height:1.5;color:var(--muted)}.readings{display:flex;flex-direction:column;gap:10px}.mass-values{margin-top:8px}.mass-note{font-size:11px;line-height:1.5;color:var(--muted);margin-top:auto}.mass-values{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mass-values>div>span{display:block;font-size:11px;color:var(--muted)}.mass-values strong{font-size:28px;font-variant-numeric:tabular-nums}.mass-values small{font-size:12px}.balance-note{font-size:11px;line-height:1.5}.playback{display:flex;align-items:center;gap:6px;padding:7px 12px;border-top:1px solid var(--line)}.playback button{font-size:12px;padding:8px 10px}.primary{background:var(--teal);border-color:var(--teal);color:white;font-weight:700}.playback #reset{margin-left:auto}.sidebar{min-height:0;display:grid;grid-template-rows:284px minmax(0,1fr);gap:12px}.setup,.procedure{padding:12px}.setup h2{margin-bottom:6px}.option{display:flex;align-items:center;gap:9px;min-height:44px;font-size:12px;cursor:pointer}.option input{width:18px;height:18px;margin:0;accent-color:var(--teal)}.option:has(input:disabled){opacity:.6}.setting{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;min-height:44px}.setting select{min-height:44px;max-width:164px;padding:6px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink)}.fall-setting{position:absolute;top:75px;left:12px;z-index:2;padding:5px 8px;border-radius:6px;background:white;border:1px solid var(--line);font-size:11px;max-width:175px}.fall-setting select{display:block;width:100%;min-height:44px;border:0;color:var(--ink);background:white}.procedure{display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}#comparison-status{font-size:12px;line-height:1.6;white-space:pre-line;color:var(--muted);min-height:38px}.result-comparison{display:grid;align-content:start;gap:12px}.result-values{display:grid;gap:12px;margin:0}.result-values>div{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}.result-values>div:first-child{padding-top:4px}.result-values dt{font-size:12px;color:var(--muted)}.result-values dd{margin:0;font-size:22px;min-height:30px;font-variant-numeric:tabular-nums}.experimental-row dd{color:var(--teal)}.experimental-row dd.pending{font-size:16px;color:var(--muted)}.deviation-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;min-height:38px}.deviation-row strong{font-size:22px;font-weight:400}.katex{font-size:1.05em}footer{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:var(--muted)}
.timer-signal{position:absolute;top:12px;left:14px;z-index:3;padding:9px 12px;border-radius:6px;background:var(--teal);color:white;font-size:13px;font-weight:700;pointer-events:none}.energy-area h2 small{margin-left:8px;font-size:10px;font-weight:400;color:var(--muted)}
@media(max-width:1139px){.app{width:100%;height:100svh}.workspace{grid-template-columns:minmax(0,1fr) 290px}h1{font-size:20px}}
@media(orientation:portrait){.app{grid-template-rows:58px minmax(0,1fr) 20px;padding:12px;gap:8px}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 302px;gap:8px}.sidebar{grid-template-columns:1fr 1fr;grid-template-rows:1fr;gap:8px}.scene{grid-template-rows:46px minmax(0,1fr) 22px 166px 54px}.comparison{padding:6px 10px}.energy-flow{height:116px}.procedure{gap:8px}.setup,.procedure{padding:10px}h1{font-size:18px}.home{padding:8px}.legend{font-size:10px}.playback{padding:5px 10px}.instrument{top:8px;right:10px;min-width:110px;padding:6px 9px}.instrument strong{font-size:19px}footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body><main class="app">
<header><div class="heading"><h1>冰的熔解比潛熱</h1></div><a class="home" href="../index.html">← 目錄</a></header>
<div class="workspace">
<section class="panel scene" aria-label="雙漏斗實驗裝置">
<div class="scene-head"><strong id="scene-title">A 對照 · B 加熱</strong><div class="scene-actions"><button id="reset-view">重設視角</button><span id="stage" class="badge">等待開始</span></div></div>
<div class="apparatus-area"><div id="apparatus-3d"></div><p id="timer-signal" class="timer-signal" role="status" hidden>時間到 · 已關掣</p><div class="instrument"><span>焦耳計</span><strong id="joules">0</strong> J<small id="clock">加熱 0.0 s · 集水 0.0 s</small></div><label class="fall-setting" id="fall-setting" hidden>碎冰掉入<select id="fallen-into"><option value="B">燒杯 B</option><option value="A">燒杯 A</option></select></label><p id="render-error" hidden>裝置載入失敗 · 請重新整理</p></div>
<div class="legend">拖曳旋轉 · 雙指移動／縮放</div>
<div class="comparison">
<div class="energy-area"><h2>電能去向<small>固定刻度</small></h2>
<svg id="energy-flow" class="energy-flow" viewBox="0 0 470 145" role="img" aria-label="焦耳計供能的去向，線寬按焦耳數，使用固定刻度">
<text id="energy-input" x="8" y="21">焦耳計 0 J</text>
<g id="energy-guide" aria-hidden="true"><path d="M8 68H140M140 68C190 68 215 30 275 30M140 68C190 68 215 62 275 62M140 68C190 68 215 94 275 94M140 68C190 68 215 126 275 126" fill="none" stroke="#91a7ab" stroke-dasharray="4 4"/><text x="8" y="105">尚未供能</text><text x="8" y="125">加熱後顯示分流</text></g>
<rect id="energy-trunk" x="8" y="68" width="132" height="0" fill="#557b89"/>
<path id="energy-fusion" fill="#087f7a"/><path id="energy-warming" fill="#e0a247"/><path id="energy-heater" fill="#587d9d"/><path id="energy-loss" fill="#9daeb2"/>
<text id="energy-fusion-label" x="286" y="34">熔冰 0 J</text>
<text id="energy-warming-label" x="286" y="66">冰升溫 0 J</text>
<text id="energy-heater-label" x="286" y="98">電熱器儲能 0 J</text>
<text id="energy-loss-label" x="286" y="130">散熱 0 J</text>
</svg><p class="ambient-note" id="ambient-energy">環境供熱（另計）：A 0 J · B 0 J</p></div>
<div class="readings"><h2>淨質量</h2><div class="mass-values"><div id="mass-a-block"><span>A · <span data-tex="m_A"></span></span><strong id="mass-a">0.0</strong><small> g</small></div><div><span>B · <span data-tex="m_B"></span></span><strong id="mass-b">0.0</strong><small> g</small></div></div><p class="balance-note" id="balance-note" hidden></p><p class="mass-note">天平即時讀數<br>已扣空杯 · 分辨率 0.1 g</p></div>
</div>
<div class="playback"><button id="play" class="primary">開始加熱</button><button id="stop" aria-label="關上電熱器" disabled>關掣</button><button id="reset">重設</button></div>
</section>
<aside class="sidebar">
<section class="panel setup"><h2>設置</h2><label class="option"><input type="checkbox" id="crushed" checked>壓碎冰塊</label><label class="option"><input type="checkbox" id="melting" checked>熔化中的冰（0 °C）</label><label class="option"><input type="checkbox" id="mesh" checked>漏斗頸放鐵絲網</label><label class="option"><input type="checkbox" id="control" checked>對照裝置 A</label><label class="setting">加熱時間<select id="duration"><option value="60">60 s</option><option value="120">120 s</option><option value="180" selected>180 s</option><option value="240">240 s</option></select></label><p id="setup-note" style="font-size:11px;color:var(--muted)">冰 200 g／杯 · 12 V · 60 W</p></section>
<section class="panel procedure" aria-label="實驗值與真確值比較"><h2>熔解比潛熱</h2>
<p id="comparison-status" aria-live="polite">先預測：只加熱 B，哪杯增重較多？
按「開始加熱」觀察。</p>
<div class="result-comparison">
<dl class="result-values">
<div class="experimental-row"><dt id="experimental-label">實驗值</dt><dd id="experimental-value" class="pending">未開始</dd></div>
<div><dt>真確值</dt><dd id="reference-value" data-tex="3.34\times10^5\,\mathrm{J\,kg^{-1}}"></dd></div>
</dl>
<div class="deviation-row"><span>偏差</span><strong id="deviation">—</strong></div>
</div></section>
</aside></div>
<footer><span>示意模型 · 固定環境供熱 · 無隨機誤差</span><span>10 倍播放</span></footer>
</main></body></html>
