<body><main class="app">
<header><div class="heading"><h1>比熱容量實驗：誤差看得見</h1><p class="subtitle">相同目標溫升，需要多少總供能？</p></div><div class="mode-buttons" aria-label="選擇樣品"><button data-material="water" aria-pressed="true">水</button><button data-material="metal" aria-pressed="false">金屬塊</button></div><a class="home" href="../index.html">← 目錄</a></header>
<div class="workspace">

<svg id="apparatus" viewBox="0 0 780 450" role="img" aria-labelledby="diagram-title diagram-desc">

<div class="legend"><i style="background:#8dbed4"></i>較冷　<i style="background:#db825f"></i>較熱　｜　同一目標溫升，與理想情況比較</div>
<div class="comparison" aria-label="與理想情況比較"><div><small>電熱器總供能</small><strong id="input-change">等待觀察</strong></div><div><small id="sample-energy-label">水實際吸收的能量</small><strong id="heat-change">等待觀察</strong></div><div><small>算出的比熱容量</small><strong id="capacity-change">等待觀察</strong></div></div>
<div class="playback"><button class="primary" id="play" disabled>開始加熱</button><button id="reset">重設</button><input class="timeline" id="timeline" type="range" min="0" max="1" step="any" value="0" aria-label="實驗進度" disabled><button id="probe" hidden>改量近端</button></div>
</section>
<aside class="sidebar">
<section class="panel scenario"><h2>檢查哪一項誤差？</h2><div class="errors" aria-label="誤差情境"><button data-error="ideal" aria-pressed="false">理想情況</button><button data-error="loss" aria-pressed="true">散熱到周圍</button><button data-error="apparatus" aria-pressed="false">器材吸熱</button><button data-error="uneven" aria-pressed="false">溫度不均</button></div><label class="correction"><input type="checkbox" id="corrected">採取預防措施</label></section>
<section class="panel energy-panel"><h2>預測：所需總供能會怎樣？</h2><p class="energy-question">達到相同目標溫升，與理想情況相比⋯</p><div class="predict-options" aria-label="總供能預測"><button data-energy="same" aria-pressed="false">不變</button><button data-energy="less" aria-pressed="false">減少</button><button data-energy="more" aria-pressed="false">增加</button></div><div class="energy-result"><strong id="energy-result">等待觀察</strong></div><p id="energy-note" class="energy-note"></p></section>
<section class="panel feedback"><h2 id="feedback-title">看裝置找原因</h2><p id="explanation"></p><div class="precaution"><strong>怎樣減少誤差？</strong><span id="precaution"></span></div><p id="prediction-feedback" role="status" aria-live="polite"></p></section>
</aside></div>
<footer><span>沒有物質流失，初、末總質量相同。顏色與熱流為示意。</span><a href="model-notes.html" target="_blank" rel="noopener">物理說明 ↗</a></footer>
